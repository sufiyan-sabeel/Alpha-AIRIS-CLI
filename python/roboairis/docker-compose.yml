services:
  # ───────────────────────────────────────────────────────────────────────────
  # roboairis orchestrator
  #
  # NOTE: `env_file:` is INTENTIONALLY ABSENT. We never want the gh-proxy's
  # PAT (`GITHUB_TOKEN` in .env) to leak into this container's environment.
  # Every variable below is an explicit allowlist; compose still reads `.env`
  # for `${VAR}` interpolation, but only the keys listed here flow into the
  # container. Adding a new secret means an explicit compose-level decision
  # about which container is allowed to see it.
  # ───────────────────────────────────────────────────────────────────────────
  roboairis:
    build:
      # pi root: gives the web-builder stage access to the workspace
      # bun.lock + catalog (web/package.json refs `catalog:` versions).
      # python/roboairis/data and pi-root excludes are filtered via
      # Dockerfile.roboairis.dockerignore at the context root.
      context: ../..
      dockerfile: Dockerfile.roboairis
      args:
        # Tag of the pre-built airis-base image produced by `bun run airis:image`
        # (sources: pi root /Dockerfile). Override per-environment as needed.
        AIRIS_BASE: airis/airis:dev
    image: roboairis:dev
    container_name: roboairis
    # Phase B (graceful shutdown): gives the orchestrator at least
    # ROBAIRIS_SHUTDOWN_DRAIN_TIMEOUT_SECONDS + ROBAIRIS_SHUTDOWN_KILL_TIMEOUT_SECONDS
    # before SIGKILL. Defaults: 25 + 5 = 30s.
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      # --- gh-proxy channel ---
      # The orchestrator NEVER holds GITHUB_TOKEN; it talks to the sibling
      # gh-proxy container over the internal-only network.
      ROBAIRIS_GH_PROXY_URL: http://gh-proxy:8081
      ROBAIRIS_GH_PROXY_HMAC_KEY: ${ROBAIRIS_GH_PROXY_HMAC_KEY:?ROBAIRIS_GH_PROXY_HMAC_KEY must be set in .env}

      # --- webhook + identity ---
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set in .env}
      ROBAIRIS_BOT_LOGIN: ${ROBAIRIS_BOT_LOGIN:?ROBAIRIS_BOT_LOGIN must be set in .env}
      ROBAIRIS_GIT_AUTHOR_NAME: ${ROBAIRIS_GIT_AUTHOR_NAME:-}
      ROBAIRIS_GIT_AUTHOR_EMAIL: ${ROBAIRIS_GIT_AUTHOR_EMAIL:?ROBAIRIS_GIT_AUTHOR_EMAIL must be set in .env}
      ROBAIRIS_REPO_ALLOWLIST: ${ROBAIRIS_REPO_ALLOWLIST:?ROBAIRIS_REPO_ALLOWLIST must be set in .env}
      ROBAIRIS_MAINTAINER_LOGINS: ${ROBAIRIS_MAINTAINER_LOGINS:-}
      ROBAIRIS_REVIEWER_BOTS: ${ROBAIRIS_REVIEWER_BOTS:-}

      # --- PR review ---
      ROBAIRIS_PR_REVIEW_ENABLED: ${ROBAIRIS_PR_REVIEW_ENABLED:-true}

      # --- model selection ---
      ROBAIRIS_MODEL: ${ROBAIRIS_MODEL:-anthropic/claude-sonnet-4-6}
      ROBAIRIS_PROVIDER: ${ROBAIRIS_PROVIDER:-}
      ROBAIRIS_THINKING: ${ROBAIRIS_THINKING:-high}

      # --- runtime tuning ---
      ROBAIRIS_MAX_CONCURRENCY: ${ROBAIRIS_MAX_CONCURRENCY:-8}
      ROBAIRIS_TASK_TIMEOUT_SECONDS: ${ROBAIRIS_TASK_TIMEOUT_SECONDS:-2400}
      ROBAIRIS_TASK_TIMEOUT_HARD_GRACE_SECONDS: ${ROBAIRIS_TASK_TIMEOUT_HARD_GRACE_SECONDS:-60}
      ROBAIRIS_REQUEST_TIMEOUT_SECONDS: ${ROBAIRIS_REQUEST_TIMEOUT_SECONDS:-120}
      ROBAIRIS_RATE_LIMIT_WINDOW_SECONDS: ${ROBAIRIS_RATE_LIMIT_WINDOW_SECONDS:-3600}
      ROBAIRIS_RATE_LIMIT_DEFAULT: ${ROBAIRIS_RATE_LIMIT_DEFAULT:-3}
      ROBAIRIS_RATE_LIMIT_CONTRIBUTOR: ${ROBAIRIS_RATE_LIMIT_CONTRIBUTOR:-10}
      ROBAIRIS_RATE_LIMIT_UNLIMITED: ${ROBAIRIS_RATE_LIMIT_UNLIMITED:-}
      ROBAIRIS_QUESTION_AUTOCLOSE_ENABLED: ${ROBAIRIS_QUESTION_AUTOCLOSE_ENABLED:-true}
      ROBAIRIS_QUESTION_AUTOCLOSE_HOURS: ${ROBAIRIS_QUESTION_AUTOCLOSE_HOURS:-4}
      ROBAIRIS_QUESTION_AUTOCLOSE_SCAN_SECONDS: ${ROBAIRIS_QUESTION_AUTOCLOSE_SCAN_SECONDS:-60}
      ROBAIRIS_REPLAY_TOKEN: ${ROBAIRIS_REPLAY_TOKEN:-}

      # --- container-fixed paths ---
      ROBAIRIS_AIRIS_COMMAND: airis
      ROBAIRIS_WORKSPACE_ROOT: /data/workspaces
      ROBAIRIS_SQLITE_PATH: /data/roboairis.sqlite
      ROBAIRIS_LOG_DIR: /data/logs
      ROBAIRIS_BIND_HOST: ${ROBAIRIS_BIND_HOST:-0.0.0.0}
      ROBAIRIS_BIND_PORT: ${ROBAIRIS_BIND_PORT:-8080}
      AIRIS_ROOT: /work/airis
    depends_on:
      gh-proxy:
        condition: service_started
    # Resolve `llm-gateway.internal` (used in /srv/agent-home/.airis/agent/models.yml) to the
    # Docker host. The actual gateway listens on 127.0.0.1:4000 on the host;
    # `host-gateway` is Docker's alias for the host bridge IP.
    extra_hosts:
      - "llm-gateway.internal:host-gateway"
    networks:
      - default
      - roboairis_internal
    volumes:
      - ${AIRIS_ROOT:-../..}:/work/airis:ro
      - roboairis_data:/data
      # Host agent config is mounted read-only under /srv/agent-home-stage
      # with host-controlled permissions. The entrypoint copies it into
      # root-owned, world-readable files under /srv/agent-home; the agent
      # subprocess runs with HOME=/srv/agent-home, so ~/.airis and ~/.agent
      # resolve there without exposing mutable host mounts.
      - ${HOME}/.airis/agent/models.container.yml:/srv/agent-home-stage/.airis/agent/models.yml:ro
      - ${HOME}/.agent/AGENT.md:/srv/agent-home-stage/.agent/AGENTS.md:ro
      - ${HOME}/.agent/rules:/srv/agent-home-stage/.agent/rules:ro
    ports:
      - "0.0.0.0:6543:8080"

  # ───────────────────────────────────────────────────────────────────────────
  # gh-proxy
  #
  # The only container that ever holds GITHUB_TOKEN. Reachable only from the
  # orchestrator on the internal-only network — no host port mapping. Every
  # request must carry a valid HMAC signature (ROBAIRIS_GH_PROXY_HMAC_KEY).
  # `env_file:` is INTENTIONALLY ABSENT for the same reason: the explicit
  # allowlist below is the only place where any var lands in this container.
  # ───────────────────────────────────────────────────────────────────────────
  gh-proxy:
    image: roboairis:dev
    container_name: gh-proxy
    restart: unless-stopped
    command: ["python", "-m", "roboairis.proxy", "serve"]
    environment:
      # PAT: lives ONLY here. The orchestrator's compose block refuses to
      # let this var into its container.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN must be set in .env}
      # Shared with the orchestrator: HMAC verification key.
      ROBAIRIS_GH_PROXY_HMAC_KEY: ${ROBAIRIS_GH_PROXY_HMAC_KEY:?ROBAIRIS_GH_PROXY_HMAC_KEY must be set in .env}
      # The proxy reuses the SandboxManager pool layout under /data/workspaces.
      ROBAIRIS_WORKSPACE_ROOT: /data/workspaces
      ROBAIRIS_SQLITE_PATH: /data/roboairis.sqlite
      ROBAIRIS_LOG_DIR: /data/logs
      # Bind on the internal network only.
      ROBAIRIS_GH_PROXY_BIND_HOST: 0.0.0.0
      ROBAIRIS_GH_PROXY_BIND_PORT: 8081
      # Settings still requires these on construction; the proxy never uses
      # them but the validator runs the same code path as the orchestrator.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set in .env}
      ROBAIRIS_BOT_LOGIN: ${ROBAIRIS_BOT_LOGIN:?ROBAIRIS_BOT_LOGIN must be set in .env}
      ROBAIRIS_GIT_AUTHOR_EMAIL: ${ROBAIRIS_GIT_AUTHOR_EMAIL:?ROBAIRIS_GIT_AUTHOR_EMAIL must be set in .env}
      ROBAIRIS_REPO_ALLOWLIST: ${ROBAIRIS_REPO_ALLOWLIST:?ROBAIRIS_REPO_ALLOWLIST must be set in .env}
    networks:
      # `default` gives gh-proxy outbound NAT to api.github.com; `roboairis_internal`
      # is how the orchestrator reaches it. No `ports:` mapping → still
      # unreachable from the host or any sibling project.
      - default
      - roboairis_internal
    volumes:
      # Shared workspace pool/worktrees so the proxy can drive git operations
      # against the same per-issue worktrees the orchestrator builds.
      - roboairis_data:/data

networks:
  # External-facing bridge: webhook ingress (8080) and the orchestrator's
  # outbound path to the host LLM gateway via extra_hosts.
  default: {}
  # Orchestrator <-> gh-proxy only. internal: true means no egress and no
  # ingress from outside the compose project.
  roboairis_internal:
    internal: true

volumes:
  # Docker-managed Linux volume so UID/GID permissions on /data are enforced.
  roboairis_data: {}
