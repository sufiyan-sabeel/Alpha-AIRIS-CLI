<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!-- AIRIS "A" monogram with circuit connector -->
  <!-- Left diagonal of A -->
  <rect x="30" y="20" width="8" height="45" rx="2" fill="#6366f1" transform="rotate(-30 30 45)"/>
  <!-- Right diagonal of A -->
  <rect x="82" y="20" width="8" height="45" rx="2" fill="#6366f1" transform="rotate(30 86 45)"/>
  <!-- Crossbar of A -->
  <rect x="38" y="55" width="34" height="8" rx="2" fill="#6366f1"/>
  <!-- Circuit connector (tail of A) -->
  <rect x="68" y="55" width="24" height="10" rx="3" fill="#06b6d4"/>
  <rect x="73" y="57" width="3" height="6" rx="1" fill="#0d0d0d"/>
  <rect x="79" y="57" width="3" height="6" rx="1" fill="#0d0d0d"/>
  <!-- Decorative grid dots -->
  <circle cx="18" cy="16" r="2" fill="#6366f1" opacity="0.8"/>
  <circle cx="102" cy="16" r="2" fill="#6366f1" opacity="0.8"/>
  <!-- Inner glow circle -->
  <circle cx="65" cy="42" r="3" fill="#06b6d4" opacity="0.6"/>
</svg>
