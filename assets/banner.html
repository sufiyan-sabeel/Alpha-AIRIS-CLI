<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha AIRIS-CLI Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    }
    .logo-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 50%, #1a0d2e 100%);
      overflow: hidden;
    }
    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image:
        linear-gradient(rgba(99,102,243,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,243,0.1) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .circuit {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.3;
    }
    .circuit.left { left: 38px; }
    .circuit.right { right: 38px; }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .airis-container {
      position: relative;
    }
    .airis-container .glow {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      opacity: 0.4;
      filter: blur(20px);
    }
    .title {
      margin-top: 20px;
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #ffffff 0%, #6366f1 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(99, 102, 243, 0.3);
    }
    .tagline {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .tagline .bracket { color: #6366f1; font-weight: bold; }
    .tagline .text { color: #cbd5e1; }
    .status {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #475569;
      letter-spacing: 0.2em;
    }
    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #6366f1;
    }
    .corner.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .corner.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .corner.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
    .corner.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }
    .bottom-glow {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: radial-gradient(circle at center bottom, rgba(99,102,243,0.15) 0%, transparent 70%);
      filter: blur(30px);
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="grid"></div>

    <!-- Circuit traces - left -->
    <svg class="circuit left" width="60" height="200" viewBox="0 0 60 200">
      <path d="M30 0 L30 60 L10 80 L10 120 L30 140 L30 200" stroke="#6366f1" stroke-width="2" fill="none"/>
      <circle cx="30" cy="60" r="4" fill="#6366f1"/>
      <circle cx="10" cy="80" r="3" fill="#6366f1"/>
      <circle cx="10" cy="120" r="3" fill="#6366f1"/>
      <circle cx="30" cy="140" r="4" fill="#6366f1"/>
      <rect x="5" y="95" width="10" height="10" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    </svg>

    <!-- Circuit traces - right -->
    <svg class="circuit right" width="60" height="200" viewBox="0 0 60 200">
      <path d="M30 0 L30 60 L50 80 L50 120 L30 140 L30 200" stroke="#6366f1" stroke-width="2" fill="none"/>
      <circle cx="30" cy="60" r="4" fill="#6366f1"/>
      <circle cx="50" cy="80" r="3" fill="#6366f1"/>
      <circle cx="50" cy="120" r="3" fill="#6366f1"/>
      <circle cx="30" cy="140" r="4" fill="#6366f1"/>
      <rect x="45" y="95" width="10" height="10" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    </svg>

    <div class="content">
      <div class="airis-container">
        <div class="glow"></div>
        <svg class="airis-symbol" width="120" height="90" viewBox="0 0 120 90">
          <!-- Left diagonal of A -->
          <rect x="30" y="20" width="8" height="45" rx="2" fill="#6366f1" transform="rotate(-30 30 45)"/>
          <!-- Right diagonal of A -->
          <rect x="82" y="20" width="8" height="45" rx="2" fill="#6366f1" transform="rotate(30 86 45)"/>
          <!-- Crossbar of A -->
          <rect x="38" y="55" width="34" height="8" rx="2" fill="#6366f1"/>
          <!-- Circuit connector -->
          <rect x="68" y="55" width="24" height="10" rx="3" fill="#06b6d4"/>
          <rect x="73" y="57" width="3" height="6" rx="1" fill="#0d0d0d"/>
          <rect x="79" y="57" width="3" height="6" rx="1" fill="#0d0d0d"/>
          <!-- Decorative grid dots -->
          <circle cx="18" cy="16" r="2" fill="#6366f1" opacity="0.8"/>
          <circle cx="102" cy="16" r="2" fill="#6366f1" opacity="0.8"/>
          <!-- Inner glow circle -->
          <circle cx="65" cy="42" r="3" fill="#06b6d4" opacity="0.6"/>
        </svg>
      </div>

      <div class="title">Alpha AIRIS</div>

      <div class="tagline">
        <span class="bracket">[</span>
        <span class="text">ai coding agent</span>
        <span class="bracket">]</span>
      </div>

      <div class="status">
        <div class="status-dot"></div>
        <span>MCP · LSP · Subagents · Web Search</span>
      </div>
    </div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="bottom-glow"></div>
  </div>
</body>
</html>
