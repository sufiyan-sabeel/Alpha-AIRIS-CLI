<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Dark background -->
  <rect width="800" height="450" fill="#0d0d0d" rx="16"/>

  <!-- Terminal window -->
  <rect x="60" y="40" width="680" height="370" fill="#1a1a2e" stroke="#1e3a5f" stroke-width="1" rx="8"/>

  <!-- Terminal header -->
  <rect x="60" y="40" width="680" height="32" fill="#16213e" rx="8"/>
  <rect x="60" y="40" width="680" height="1" fill="#1e3a5f"/>

  <!-- Terminal dots -->
  <circle cx="80" cy="58" r="5" fill="#e63946"/>
  <circle cx="100" cy="58" r="5" fill="#f4a261"/>
  <circle cx="120" cy="58" r="5" fill="#2a9d8f"/>

  <!-- Terminal prompt line -->
  <text x="80" y="90" font-family="monospace" font-size="14" fill="#6366f1">$</text>
  <text x="96" y="90" font-family="monospace" font-size="14" fill="#e94560">airis</text>
  <text x="150" y="90" font-family="monospace" font-size="14" fill="#94a3b8">coding-agent session</text>

  <!-- Terminal content -->
  <text x="80" y="120" font-family="monospace" font-size="12" fill="#64748b">// Alpha AIRIS-CLI — AI Coding Agent</text>
  <text x="80" y="144" font-family="monospace" font-size="12" fill="#94a3b8">&gt; Analyzing repository structure...</text>
  <text x="80" y="168" font-family="monospace" font-size="12" fill="#94a3b8">&gt; Found 32 built-in tools | MCP | LSP | Subagents</text>
  <text x="80" y="192" font-family="monospace" font-size="12" fill="#4ade80">✓ Code review complete</text>
  <text x="80" y="216" font-family="monospace" font-size="12" fill="#4ade80">✓ Tests passed (47/47)</text>
  <text x="80" y="240" font-family="monospace" font-size="12" fill="#f97316">⚡ 3 issues found — generating fixes...</text>

  <!-- Code snippet window -->
  <rect x="420" y="230" width="300" height="160" fill="#0d1424" stroke="#1e3a5f" stroke-width="1" rx="6"/>
  <rect x="420" y="230" width="300" height="20" fill="#16213e" rx="6"/>
  <text x="436" y="246" font-family="monospace" font-size="11" fill="#94a3b8">function processFile(file)</text>

  <text x="436" y="272" font-family="monospace" font-size="11" fill="#8b5cf7">export</text><text x="490" y="272" font-family="monospace" font-size="11" fill="#94a3b8"> async function</text><text x="572" y="272" font-family="monospace" font-size="11" fill="#f8fafc">processFile</text><text x="624" y="272" font-family="monospace" font-size="11" fill="#94a3b8">(file) {</text>
  <text x="436" y="292" font-family="monospace" font-size="11" fill="#94a3b8">  const data = await</text><text x="556" y="292" font-family="monospace" font-size="11" fill="#f8fafc">readFile</text><text x="600" y="292" font-family="monospace" font-size="11" fill="#94a3b8">(file.path);</text>
  <text x="436" y="312" font-family="monospace" font-size="11" fill="#94a3b8">  return data</text><text x="530" y="312" font-family="monospace" font-size="11" fill="#8b5cf7">.replace</text><text x="576" y="312" font-family="monospace" font-size="11" fill="#94a3b8">(old, new);</text>
  <text x="436" y="332" font-family="monospace" font-size="11" fill="#94a3b8">}</text>

  <!-- AIRIS logo in top-left corner -->
  <g transform="translate(80, 400)">
    <!-- AIRIS "A" -->
    <rect x="0" y="0" width="6" height="24" rx="2" fill="#6366f1" transform="rotate(-30 0 12)"/>
    <rect x="44" y="0" width="6" height="24" rx="2" fill="#6366f1" transform="rotate(30 48 12)"/>
    <rect x="6" y="16" width="38" height="6" rx="2" fill="#6366f1"/>
    <!-- Circuit connector -->
    <rect x="54" y="16" width="16" height="8" rx="3" fill="#06b6d4"/>
    <rect x="57" y="18" width="3" height="4" rx="1" fill="#0d0d0d"/>
    <rect x="61" y="18" width="3" height="4" rx="1" fill="#0d0d0d"/>
  </g>

  <!-- Brand name -->
  <text x="52" y="420" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">AIRIS</text>
  <text x="110" y="420" font-family="monospace" font-size="14" fill="#6366f1">· KageOS</text>

  <!-- Tagline -->
  <text x="80" y="442" font-family="monospace" font-size="11" fill="#64748b">[ ai coding agent ]</text>
</svg>
